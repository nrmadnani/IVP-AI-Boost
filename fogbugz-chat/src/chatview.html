<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- Highlight.js for syntax highlighting -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <link
      rel="stylesheet"
      href="https://microsoft.github.io/vscode-codicons/dist/codicon.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
      mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
        securityLevel: "loose",
      });
    </script>

    <style>
      :root {
        --bg: var(--vscode-editor-background);
        --fg: var(--vscode-editor-foreground);
        --border: var(--vscode-editorWidget-border);
        --input-bg: var(--vscode-input-background);
        --input-fg: var(--vscode-input-foreground);
        --button-bg: var(--vscode-button-background);
        --button-fg: var(--vscode-button-foreground);
        --user-bg: var(--vscode-textBlockQuote-background);
        --assistant-bg: var(--vscode-editorWidget-background);
        --code-bg: var(--vscode-textCodeBlock-background);
        --link-color: var(--vscode-textLink-foreground);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--vscode-font-family);
        font-size: var(--vscode-font-size);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* CHAT CONTAINER */

      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* MESSAGES */

      .message {
        padding: 10px 12px;
        border-radius: 8px;
        max-width: 100%;
        line-height: 1.55;
        font-size: 13px;
        position: relative;
      }

      .user {
        align-self: flex-end;
        background: var(--user-bg);
        border: 1px solid var(--border);
        white-space: pre-wrap;
      }

      .assistant {
        align-self: flex-start;
        background: var(--assistant-bg);
        border: 1px solid var(--border);
      }

      .system {
        align-self: center;
        background: transparent;
        border: none;
        font-size: 12px;
        opacity: 0.65;
        font-style: italic;
      }

      /* ASSISTANT MESSAGE WRAPPER */

      .assistant-message-wrapper {
        position: relative;
      }

      .assistant:hover {
        opacity: 1;
      }
      /* assistant content wrapper */
      .assistant-message-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* toolbar container */
      /* MESSAGE TOOLBAR */

      .message-toolbar {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 4px;

        /* always visible but subtle */
        opacity: 0.45;
        transition: opacity 0.15s ease;
      }

      /* only toolbar hover increases opacity */
      .message-toolbar:hover {
        opacity: 1;
      }

      /* TOOLBAR BUTTON */

      .toolbar-btn {
        width: 26px;
        height: 26px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 4px;
        border: none;
        cursor: pointer;

        background: transparent;
        color: var(--vscode-editor-foreground);

        padding: 0;
      }

      /* fix codicon alignment */

      .toolbar-btn.codicon {
        font-size: 16px;
        line-height: 1;

        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* button hover does NOT affect message background */

      .toolbar-btn:hover {
        background: var(--vscode-toolbar-hoverBackground);
        opacity: 1;
      }

      /* MARKDOWN CONTENT */

      .assistant-content {
        font-family: var(--vscode-font-family);
        padding-right: 26px;
      }

      .assistant-content p {
        margin: 0 0 8px 0;
      }

      .assistant-content p:last-child {
        margin-bottom: 0;
      }

      .assistant-content h1,
      .assistant-content h2,
      .assistant-content h3,
      .assistant-content h4,
      .assistant-content h5,
      .assistant-content h6 {
        margin: 12px 0 8px 0;
        font-weight: 600;
      }

      .assistant-content h1 {
        font-size: 1.45em;
      }
      .assistant-content h2 {
        font-size: 1.25em;
      }
      .assistant-content h3 {
        font-size: 1.1em;
      }

      /* LISTS */

      .assistant-content ul,
      .assistant-content ol {
        margin: 8px 0;
        padding-left: 22px;
      }

      .assistant-content li {
        margin: 4px 0;
      }

      /* LINKS */

      .assistant-content a {
        color: var(--link-color);
        text-decoration: none;
      }

      .assistant-content a:hover {
        text-decoration: underline;
      }

      /* INLINE CODE */

      .assistant-content code {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 6px;
        font-family: var(--vscode-editor-font-family);
        font-size: 12px;
      }

      /* CODE BLOCKS */

      .assistant-content pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        margin: 10px 0;
        overflow-x: auto;
        position: relative;
      }

      .assistant-content pre code {
        background: transparent;
        padding: 0;
        border: none;
        font-family: var(--vscode-editor-font-family);
        font-size: 12px;
        line-height: 1.55;
      }

      /* CODE BLOCK TOOLBAR */

      .code-block-wrapper {
        position: relative;
      }

      .copy-button {
        position: absolute;
        top: 6px;
        right: 6px;

        background: var(--button-bg);
        color: var(--button-fg);

        border: none;
        border-radius: 4px;

        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;

        opacity: 0.7;
        transition: opacity 0.15s ease;
      }

      .copy-button:hover {
        opacity: 1;
      }

      .copy-button.copied {
        background: #4caf50;
      }

      /* TABLES */

      .assistant-content table {
        border-collapse: collapse;
        width: 100%;
        margin: 12px 0;
        font-size: 13px;
      }

      .assistant-content table th,
      .assistant-content table td {
        border: 1px solid var(--border);
        padding: 8px 10px;
        text-align: left;
      }

      .assistant-content table th {
        background: var(--code-bg);
        font-weight: 600;
      }

      .assistant-content table tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.03);
      }

      /* BLOCKQUOTE */

      .assistant-content blockquote {
        border-left: 3px solid var(--border);
        padding-left: 12px;
        margin: 8px 0;
        opacity: 0.85;
      }

      /* HR */

      .assistant-content hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 16px 0;
      }

      /* MERMAID */

      .mermaid {
        background: var(--assistant-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        margin: 12px 0;
        overflow-x: auto;
      }

      /* INPUT AREA */

      #input-container {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid var(--border);
        background: var(--bg);
        align-items: flex-end;
      }

      #input-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      #input {
        width: 100%;
        background: var(--input-bg);
        color: var(--input-fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        font-family: inherit;
        font-size: 13px;
        order: 2;
      }

      #input:focus {
        outline: 1px solid var(--vscode-focusBorder);
      }

      /* COMMAND MENU */

      #command-menu {
        width: 100%;
        background: var(--vscode-editorWidget-background);
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        display: none;
        z-index: 1000;
        order: 1;
      }

      #command-menu.visible {
        display: block;
      }

      .command-item {
        padding: 8px 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-bottom: 1px solid var(--border);
      }

      .command-item:last-child {
        border-bottom: none;
      }

      .command-item:hover,
      .command-item.selected {
        background: var(--vscode-list-hoverBackground);
      }

      .command-name {
        font-size: 13px;
        font-weight: 500;
      }

      .command-description {
        font-size: 11px;
        color: var(--vscode-descriptionForeground);
        opacity: 0.8;
      }

      /* BUTTON */

      button {
        background: var(--button-bg);
        color: var(--button-fg);
        border: none;
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }

      button:hover {
        opacity: 0.9;
      }

      /* SCROLLBAR */

      #chat::-webkit-scrollbar {
        width: 10px;
      }

      #chat::-webkit-scrollbar-track {
        background: var(--bg);
      }

      #chat::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 5px;
      }

      #chat::-webkit-scrollbar-thumb:hover {
        background: var(--vscode-scrollbarSlider-hoverBackground);
      }

      /* CODE GENERATION TEMPLATE */

      .code-template {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--assistant-bg);
      }

      .code-template h3 {
        margin: 0 0 4px 0;
        font-size: 14px;
      }

      .template-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .product-block {
        border: 1px dashed var(--border);
        padding: 10px;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .endpoint-row {
        display: grid;
        grid-template-columns: 1fr 1fr 120px;
        gap: 6px;
      }

      .template-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 6px;
      }

      /* SEARCHABLE PRODUCT DROPDOWN */

      .product-select-wrapper {
        position: relative;
      }

      .product-search {
        background: var(--input-bg);
        color: var(--input-fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 5px 6px;
        font-size: 13px;
      }

      .product-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        max-height: 200px;
        overflow-y: auto;
        background: var(--vscode-editorWidget-background);
        border: 1px solid var(--border);
        border-radius: 4px;
        z-index: 50;
        display: none;
      }

      .product-dropdown.visible {
        display: block;
      }

      .product-option {
        padding: 6px 8px;
        cursor: pointer;
        font-size: 13px;
      }

      .product-option:hover {
        background: var(--vscode-list-hoverBackground);
      }

      /* delete icons */

      .delete-btn {
        cursor: pointer;
        font-size: 12px;
        opacity: 0.6;
        border: none;
        background: none;
      }

      .delete-btn:hover {
        opacity: 1;
      }

      /* endpoint row */

      .endpoint-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .endpoint-row input {
        flex: 1;
      }

      /* product header */

      .product-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
      }

      /* add buttons */

      .template-add {
        margin-top: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="chat"></div>

    <div id="input-container">
      <div id="input-wrapper">
        <div id="command-menu">
          <div class="command-item" data-command="/new">
            <span class="command-name">/new</span>
            <span class="command-description">Start a new conversation</span>
          </div>
          <div class="command-item" data-command="/clear">
            <span class="command-name">/clear</span>
            <span class="command-description">Clear chat history</span>
          </div>
          <div class="command-item" data-command="/generate-code">
            <span class="command-name">/generate-code</span>
            <span class="command-description"
              >Generate code from structured template</span
            >
          </div>
        </div>
        <input
          id="input"
          placeholder="Ask Othisi..."
          onkeydown="handleKeyDown(event)"
        />
      </div>
      <button onclick="send()" style="width: fit-content">Send</button>
    </div>

    <script>
      const vscode = acquireVsCodeApi();
      const chat = document.getElementById("chat");
      const input = document.getElementById("input");
      const commandMenu = document.getElementById("command-menu");
      let selectedCommandIndex = -1;

      const commands = [
        { name: "/new", description: "Start a new conversation" },
        { name: "/clear", description: "Clear chat history" },
        {
          name: "/generate-code",
          description: "Generate API/client code using template",
        },
      ];

      const IVP_PRODUCTS = [
        "IVP Polaris",
        "IVP RAD Dev",
        "IVP Price Master",
        "IVP PnL Monitor 2.0",
        "IVP Recon 4.9",
        "IVP Security Master v5.3",
        "IVP Sec Master Excel Add-in",
        "IVP Recon 6.5",
        "IVP Security Master 6.5",
        "IVP Security Master v6.5",
        "IVP Reference Master v2.0",
        "IVP Reference Master v3.0",
        "IVP Solutions Documentation",
        "IVP EDM DEV",
        "IVP Security Master 8.0",
        "IVP Security Master v8.0",
        "IVP Security Master v8.5",
        "IVP Cash Master v6.0",
        "IVP OMS v3.0",
        "IVP Treasury v5.0",
        "IVP Polaris User Manual v10.0",
        "IVP Polaris User Manual v12.0",
        "IVP Risk Service",
        "IVP SRM Technical Specs",
        "IVP SRM v15.0",
        "IVP Raptor v11.2",
        "IVP Raptor v11.3",
        "IVP EDM v2.4",
        "IVP EDM v3.0",
        "IVP EDM v3.5",
        "IVP EDM v3.5.1",
        "IVP EDM v4.0",
        "IVP EDM v4.5",
        "IVP EDM v15.0",
        "IVP Price Master Excel Add-in v5.0",
        "IVP Price Master Excel Add-in v5.0.17",
        "IVP Expense Manager v1007",
        "IVP ORKA v15.0",
        "IVP Polaris v15.0",
        "IVP Polaris Excel Add-in v12.0",
        "IVP Cash Master v7.0",
        "IVP Reference Master v3.2",
      ];

      // Configure marked.js options
      marked.setOptions({
        breaks: true,
        gfm: true,
        highlight: function (code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(code, { language: lang }).value;
            } catch (err) {}
          }
          return hljs.highlightAuto(code).value;
        },
      });

      // Request chat history when webview loads
      vscode.postMessage({ type: "requestHistory" });

      // Show/hide command menu based on input
      input.addEventListener("input", function () {
        const value = input.value;
        if (value === "/" || value.startsWith("/")) {
          showCommandMenu();
          filterCommands(value);
        } else {
          hideCommandMenu();
        }
      });

      // Handle clicks outside to close menu
      document.addEventListener("click", function (e) {
        if (!input.contains(e.target) && !commandMenu.contains(e.target)) {
          hideCommandMenu();
        }
      });

      // Handle command item clicks
      document.querySelectorAll(".command-item").forEach((item) => {
        item.addEventListener("click", function () {
          const command = this.getAttribute("data-command");
          input.value = command;
          hideCommandMenu();
          input.focus();
        });
      });

      function showCommandMenu() {
        commandMenu.classList.add("visible");
        selectedCommandIndex = -1;
        updateSelectedCommand();
      }

      function hideCommandMenu() {
        commandMenu.classList.remove("visible");
        selectedCommandIndex = -1;
      }

      function filterCommands(value) {
        const items = commandMenu.querySelectorAll(".command-item");
        let visibleCount = 0;

        items.forEach((item) => {
          const command = item.getAttribute("data-command");
          if (command.startsWith(value.toLowerCase())) {
            item.style.display = "flex";
            visibleCount++;
          } else {
            item.style.display = "none";
          }
        });

        // Hide menu if no matches
        if (visibleCount === 0) {
          hideCommandMenu();
        }
      }

      function updateSelectedCommand() {
        const items = Array.from(
          commandMenu.querySelectorAll(".command-item"),
        ).filter((item) => item.style.display !== "none");

        items.forEach((item, index) => {
          if (index === selectedCommandIndex) {
            item.classList.add("selected");
          } else {
            item.classList.remove("selected");
          }
        });
      }

      function handleKeyDown(event) {
        const isMenuVisible = commandMenu.classList.contains("visible");

        if (isMenuVisible) {
          const visibleItems = Array.from(
            commandMenu.querySelectorAll(".command-item"),
          ).filter((item) => item.style.display !== "none");

          if (event.key === "ArrowDown") {
            event.preventDefault();
            selectedCommandIndex = Math.min(
              selectedCommandIndex + 1,
              visibleItems.length - 1,
            );
            updateSelectedCommand();
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            selectedCommandIndex = Math.max(selectedCommandIndex - 1, 0);
            updateSelectedCommand();
          } else if (event.key === "Enter") {
            if (
              selectedCommandIndex >= 0 &&
              selectedCommandIndex < visibleItems.length
            ) {
              event.preventDefault();
              const command =
                visibleItems[selectedCommandIndex].getAttribute("data-command");
              input.value = command;
              hideCommandMenu();
              return;
            }
            send();
          } else if (event.key === "Escape") {
            event.preventDefault();
            hideCommandMenu();
          }
        } else if (event.key === "Enter") {
          send();
        }
      }

      function addMessage(text, cls) {
        const div = document.createElement("div");
        div.className = "message " + cls;

        if (cls === "assistant") {
          const wrapper = document.createElement("div");
          wrapper.className = "assistant-message-wrapper";

          const contentDiv = document.createElement("div");
          contentDiv.className = "assistant-content";
          contentDiv.innerHTML = marked.parse(text);

          renderMermaid(contentDiv);

          /* TOOLBAR */

          const toolbar = document.createElement("div");
          toolbar.className = "message-toolbar";

          /* COPY BUTTON */

          const copyBtn = document.createElement("button");
          copyBtn.className = "toolbar-btn codicon codicon-copy";

          copyBtn.onclick = () => {
            navigator.clipboard.writeText(text).then(() => {
              copyBtn.classList.remove("codicon-copy");
              copyBtn.classList.add("codicon-check");

              setTimeout(() => {
                copyBtn.classList.remove("codicon-check");
                copyBtn.classList.add("codicon-copy");
              }, 1500);
            });
          };

          /* THUMBS UP */

          const upBtn = document.createElement("button");
          upBtn.className = "toolbar-btn codicon codicon-thumbsup";

          upBtn.onclick = () => {
            vscode.postMessage({
              type: "feedback",
              value: "up",
              message: text,
            });
          };

          /* THUMBS DOWN */

          const downBtn = document.createElement("button");
          downBtn.className = "toolbar-btn codicon codicon-thumbsdown";

          downBtn.onclick = () => {
            vscode.postMessage({
              type: "feedback",
              value: "down",
              message: text,
            });
          };

          /* REGENERATE */

          const regenBtn = document.createElement("button");
          regenBtn.className = "toolbar-btn codicon codicon-refresh";

          regenBtn.onclick = () => {
            vscode.postMessage({
              type: "regenerate",
              message: text,
            });
          };

          toolbar.appendChild(copyBtn);
          toolbar.appendChild(upBtn);
          toolbar.appendChild(downBtn);
          toolbar.appendChild(regenBtn);

          /* CODE BLOCK COPY */

          contentDiv.querySelectorAll("pre code").forEach((block) => {
            const codeWrapper = document.createElement("div");
            codeWrapper.className = "code-block-wrapper";

            const codeCopyBtn = document.createElement("button");
            codeCopyBtn.className = "copy-button";
            codeCopyBtn.textContent = "Copy";

            codeCopyBtn.onclick = () => {
              const code = block.textContent;

              navigator.clipboard.writeText(code).then(() => {
                codeCopyBtn.textContent = "Copied!";
                codeCopyBtn.classList.add("copied");

                setTimeout(() => {
                  codeCopyBtn.textContent = "Copy";
                  codeCopyBtn.classList.remove("copied");
                }, 2000);
              });
            };

            const pre = block.parentElement;

            pre.parentElement.insertBefore(codeWrapper, pre);
            codeWrapper.appendChild(pre);
            codeWrapper.appendChild(codeCopyBtn);
          });

          wrapper.appendChild(contentDiv);
          wrapper.appendChild(toolbar);

          div.appendChild(wrapper);
        } else {
          div.textContent = text;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }
      function sanitizeMermaid(source) {
        return (
          source
            // Replace unicode arrows
            .replace(/→/g, "->")
            .replace(/←/g, "<-")
            .replace(/⇒/g, "=>")

            // Replace smart quotes
            .replace(/[“”]/g, '"')
            .replace(/[‘’]/g, "'")

            // Normalize ellipsis
            .replace(/…/g, "...")

            // REMOVE ALL PARENTHESES
            .replace(/[()]/g, "")
        );
      }
      function renderMermaid(container) {
        const mermaidBlocks = container.querySelectorAll(
          "pre code.language-mermaid",
        );
        const mermaidNodes = [];

        mermaidBlocks.forEach((block) => {
          const parentPre = block.parentElement;
          const graphDefinition = block.textContent;

          const mermaidDiv = document.createElement("div");
          mermaidDiv.className = "mermaid";
          mermaidDiv.textContent = graphDefinition;

          parentPre.replaceWith(mermaidDiv);
          mermaidNodes.push(mermaidDiv);
        });

        if (mermaidNodes.length > 0) {
          try {
            // Sanitize Mermaid definitions before rendering
            mermaidNodes.forEach((node) => {
              node.textContent = sanitizeMermaid(node.textContent);
            });
            mermaid.run({ nodes: mermaidNodes });
          } catch (err) {
            console.error("Mermaid render failed:", err);
            // HARD FAIL: remove all Mermaid output
            mermaidNodes.forEach((div) => div.remove());
          }
        }
      }

      function send(templatePrompt = null) {
        let text = templatePrompt || input.value.trim();

        // Detect if template exists and Send button was used
        if (!templatePrompt) {
          const template = document.querySelector(".code-template");

          if (template) {
            const root = template.closest(".message");
            const generatedPrompt = buildPrompt(root);

            if (!generatedPrompt) {
              addMessage(
                "Please complete product and functionality fields before sending.",
                "system",
              );
              return;
            }

            text = generatedPrompt;

            // remove template after sending
            root.remove();
          }
        }

        if (!text) return;

        hideCommandMenu();

        // handle /clear and /new
        if (text.toLowerCase() === "/clear" || text.toLowerCase() === "/new") {
          vscode.postMessage({ type: "userMessage", text });
          input.value = "";
          return;
        }

        // handle /generate-code
        if (text.toLowerCase() === "/generate-code") {
          renderCodeTemplate();
          input.value = "";
          return;
        }

        // display message in chat
        addMessage(text, "user");

        // send to extension
        vscode.postMessage({
          type: "userMessage",
          text,
        });

        input.value = "";
      }

      function renderCodeTemplate() {
        const div = document.createElement("div");
        div.className = "message assistant";

        div.innerHTML = `
	<div class="code-template">

	<h3>Code Generation Template</h3>

	<div class="template-row">
	<label>Code Type</label>
	<select id="code-type">
	<option value="">Select Code Type</option>
	<option value="rest">REST Endpoint</option>
	<option value="csharp">C# Client</option>
	<option value="python">Python Client</option>
	<option value="javascript">JavaScript Client</option>
	</select>
	</div>

	<div id="products-container"></div>

	<button id="add-product">Add Product</button>

	<div class="template-actions">
	<button id="generate-code">Generate Code</button>
	</div>

	</div>
	`;

        chat.appendChild(div);
        initializeTemplateEvents(div);
      }
      function isEndpointValid(container) {
        const rows = container.querySelectorAll(".endpoint-row");

        if (rows.length === 0) return false;

        const last = rows[rows.length - 1]
          .querySelector(".endpoint-name")
          .value.trim();

        return last.length > 0;
      }

      function isProductValid(block) {
        const product = block.querySelector(".product-search").value.trim();

        const endpoints = block.querySelectorAll(".endpoint-name");

        if (!product) return false;

        for (const ep of endpoints) {
          if (ep.value.trim()) return true;
        }

        return false;
      }

      function createProductSelector() {
        const options = IVP_PRODUCTS.map(
          (p) => `<div class="product-option">${p}</div>`,
        ).join("");

        return `
	<div class="product-select-wrapper">

	<input class="product-search" placeholder="Search product..." />

	<div class="product-dropdown">
	${options}
	</div>

	</div>
	`;
      }
      function createEndpointRow() {
        return `
<div class="endpoint-row">

<input class="endpoint-name"
placeholder="Describe functionality (Create Trade, Get Portfolio Positions)">

<button class="delete-btn delete-endpoint">✕</button>

</div>
`;
      }

      function createProductBlock() {
        return `
<div class="product-block">

<div class="product-header">
<span>Product</span>
<button class="delete-btn delete-product">✕</button>
</div>

${createProductSelector()}

<div class="endpoints-container"></div>

<button class="add-endpoint template-add">Add Functionality</button>

</div>
`;
      }

      function initializeTemplateEvents(root) {
        const productsContainer = root.querySelector("#products-container");
        const addProductBtn = root.querySelector("#add-product");

        /* ADD PRODUCT */

        addProductBtn.onclick = () => {
          const blocks = productsContainer.querySelectorAll(".product-block");

          if (blocks.length) {
            const last = blocks[blocks.length - 1];

            if (!isProductValid(last)) {
              addMessage(
                "Finish selecting a product and at least one functionality before adding another.",
                "system",
              );

              return;
            }
          }

          const wrapper = document.createElement("div");
          wrapper.innerHTML = createProductBlock();

          const block = wrapper.firstElementChild;

          productsContainer.appendChild(block);

          initializeProductSearch(block);
          attachProductHandlers(block);
        };

        /* GENERATE CODE BUTTON */

        root.querySelector("#generate-code").onclick = () => {
          const prompt = buildPrompt(root);

          if (!prompt) {
            addMessage(
              "Please complete product and functionality fields.",
              "system",
            );

            return;
          }

          send(prompt);

          // remove template after sending
          root.remove();
        };
      }

      function attachProductHandlers(block) {
        const endpointsContainer = block.querySelector(".endpoints-container");

        /* ADD FUNCTIONALITY */

        block.querySelector(".add-endpoint").onclick = () => {
          if (
            !isEndpointValid(endpointsContainer) &&
            endpointsContainer.children.length
          ) {
            addMessage(
              "Fill the current functionality before adding another.",
              "system",
            );

            return;
          }

          const row = document.createElement("div");
          row.innerHTML = createEndpointRow();

          const el = row.firstElementChild;

          endpointsContainer.appendChild(el);

          /* delete functionality */

          el.querySelector(".delete-endpoint").onclick = () => {
            el.remove();
          };
        };

        /* delete product */

        block.querySelector(".delete-product").onclick = () => {
          block.remove();
        };
      }
      function buildPrompt(root) {
        const codeType = root.querySelector("#code-type").value;

        if (!codeType) return null;

        const blocks = root.querySelectorAll(".product-block");

        if (!blocks.length) return null;

        let productList = [];
        let sections = [];
        let index = 1;

        for (const block of blocks) {
          const product = block.querySelector(".product-search").value.trim();

          if (!product) continue;

          const endpoints = block.querySelectorAll(".endpoint-name");

          let funcs = [];

          endpoints.forEach((ep) => {
            const val = ep.value.trim();
            if (val) funcs.push(val);
          });

          if (!funcs.length) continue;

          productList.push(product);

          let section = `${index}. Use ${product} to create the following functionality:\n`;

          funcs.forEach((f) => {
            section += `- ${f}\n`;
          });

          sections.push(section);

          index++;
        }

        if (!sections.length) return null;

        const prompt = `Generate a code block for ${codeType} based on the following products ${productList.join(", ")}.

${sections.join("\n")}

Use ${codeType} for the implementation.

Follow industry best practices, clean architecture, proper authentication handling,
clear function naming, modular functions, and produce clean well-formatted code blocks.`;

        return prompt;
      }

      function initializeProductSearch(block) {
        const search = block.querySelector(".product-search");
        const dropdown = block.querySelector(".product-dropdown");
        const options = dropdown.querySelectorAll(".product-option");

        search.addEventListener("focus", () => {
          dropdown.classList.add("visible");
        });

        search.addEventListener("input", () => {
          const value = search.value.toLowerCase();

          options.forEach((opt) => {
            if (opt.textContent.toLowerCase().includes(value)) {
              opt.style.display = "block";
            } else {
              opt.style.display = "none";
            }
          });
        });

        options.forEach((opt) => {
          opt.onclick = () => {
            search.value = opt.textContent;
            dropdown.classList.remove("visible");
          };
        });
      }
      function collectTemplateData(root) {
        const codeType = root.querySelector("#code-type").value;
        if (!codeType) return { valid: false };

        const products = [];

        root.querySelectorAll(".product-block").forEach((productBlock) => {
          const productName =
            productBlock.querySelector(".product-search").value;

          if (!productName) return;

          const endpoints = [];

          productBlock.querySelectorAll(".endpoint-row").forEach((row) => {
            const name = row.querySelector(".endpoint-name").value;
            const url = row.querySelector(".endpoint-url").value;
            const auth = row.querySelector(".auth-type").value;

            if (name && url) {
              endpoints.push({ name, url, auth });
            }
          });

          if (endpoints.length > 0) {
            products.push({
              product: productName,
              endpoints,
            });
          }
        });

        if (products.length === 0) return { valid: false };

        return {
          valid: true,
          data: {
            codeType,
            products,
          },
        };
      }

      window.addEventListener("message", (event) => {
        const msg = event.data;

        if (msg.type === "assistant") {
          addMessage(msg.text, "assistant");
        } else if (msg.type === "loadHistory") {
          // Load chat history
          chat.innerHTML = "";
          msg.history.forEach((item) => {
            addMessage(item.text, item.type);
          });
        } else if (msg.type === "clearHistory") {
          // Clear chat history with optional system message
          chat.innerHTML = "";
          if (msg.message) {
            addMessage(msg.message, "system");
          } else {
            addMessage("Chat history cleared.", "system");
          }
        }
      });

      // Focus input on load
      input.focus();
    </script>
  </body>
</html>
