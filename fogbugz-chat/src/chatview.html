<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
	<!-- Marked.js for Markdown parsing -->
	<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
	
	<!-- Highlight.js for syntax highlighting -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
	<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    securityLevel: 'loose'
  });
</script>

	<style>
		:root {
			--bg: var(--vscode-editor-background);
			--fg: var(--vscode-editor-foreground);
			--border: var(--vscode-editorWidget-border);
			--input-bg: var(--vscode-input-background);
			--input-fg: var(--vscode-input-foreground);
			--button-bg: var(--vscode-button-background);
			--button-fg: var(--vscode-button-foreground);
			--user-bg: var(--vscode-textBlockQuote-background);
			--assistant-bg: var(--vscode-editorWidget-background);
			--code-bg: var(--vscode-textCodeBlock-background);
			--link-color: var(--vscode-textLink-foreground);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
			background: var(--bg);
			color: var(--fg);
			font-family: var(--vscode-font-family);
			font-size: var(--vscode-font-size);
			display: flex;
			flex-direction: column;
			height: 100vh;
			overflow: hidden;
		}

		#chat {
			flex: 1;
			overflow-y: auto;
			padding: 12px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.message {
			padding: 10px 12px;
			border-radius: 8px;
			max-width: 100%;
			line-height: 1.5;
			font-size: 13px;
		}

		.user {
			align-self: flex-end;
			background: var(--user-bg);
			border: 1px solid var(--border);
			white-space: pre-wrap;
		}

		.assistant {
			align-self: flex-start;
			background: var(--assistant-bg);
			border: 1px solid var(--border);
		}

		.system {
			align-self: center;
			background: transparent;
			border: none;
			font-size: 12px;
			opacity: 0.6;
			font-style: italic;
		}

		/* Markdown formatting for assistant messages */
		.assistant-content {
			font-family: var(--vscode-font-family);
		}

		.assistant-content p {
			margin: 0 0 8px 0;
		}

		.assistant-content p:last-child {
			margin-bottom: 0;
		}

		.assistant-content h1,
		.assistant-content h2,
		.assistant-content h3,
		.assistant-content h4,
		.assistant-content h5,
		.assistant-content h6 {
			margin: 12px 0 8px 0;
			font-weight: 600;
		}

		.assistant-content h1 { font-size: 1.5em; }
		.assistant-content h2 { font-size: 1.3em; }
		.assistant-content h3 { font-size: 1.1em; }

		.assistant-content ul,
		.assistant-content ol {
			margin: 8px 0;
			padding-left: 24px;
		}

		.assistant-content li {
			margin: 4px 0;
		}

		.assistant-content a {
			color: var(--link-color);
			text-decoration: none;
		}

		.assistant-content a:hover {
			text-decoration: underline;
		}

		/* Code blocks */
		.assistant-content pre {
			background: var(--code-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 12px;
			margin: 8px 0;
			overflow-x: auto;
			position: relative;
		}

		.assistant-content pre code {
			background: transparent;
			padding: 0;
			border: none;
			font-family: var(--vscode-editor-font-family);
			font-size: 12px;
			line-height: 1.5;
		}

		/* Inline code */
		.assistant-content code {
			background: var(--code-bg);
			border: 1px solid var(--border);
			border-radius: 3px;
			padding: 2px 6px;
			font-family: var(--vscode-editor-font-family);
			font-size: 12px;
		}

		/* Tables */
		.assistant-content table {
			border-collapse: collapse;
			width: 100%;
			margin: 12px 0;
			font-size: 13px;
		}

		.assistant-content table th,
		.assistant-content table td {
			border: 1px solid var(--border);
			padding: 8px 12px;
			text-align: left;
		}

		.assistant-content table th {
			background: var(--code-bg);
			font-weight: 600;
		}

		.assistant-content table tr:nth-child(even) {
			background: rgba(255, 255, 255, 0.03);
		}

		/* Blockquotes */
		.assistant-content blockquote {
			border-left: 3px solid var(--border);
			padding-left: 12px;
			margin: 8px 0;
			opacity: 0.8;
		}

		/* Horizontal rule */
		.assistant-content hr {
			border: none;
			border-top: 1px solid var(--border);
			margin: 16px 0;
		}

		/* Copy button for code blocks */
		.code-block-wrapper {
			position: relative;
		}

		.copy-button {
			position: absolute;
			top: 8px;
			right: 8px;
			background: var(--button-bg);
			color: var(--button-fg);
			border: none;
			border-radius: 4px;
			padding: 4px 8px;
			font-size: 11px;
			cursor: pointer;
			opacity: 0.7;
			transition: opacity 0.2s;
		}

		.copy-button:hover {
			opacity: 1;
		}

		.copy-button.copied {
			background: #4caf50;
		}

		/* Input container */
#input-container {
	display: flex;
	gap: 6px;
	padding: 8px;
	border-top: 1px solid var(--border);
	background: var(--bg);
	align-items: flex-end; /* 👈 KEY FIX */
}

#input-wrapper {
	flex: 1;
	position: relative;
	display: flex;
	flex-direction: column;
}

#input {
	width: 100%;
	background: var(--input-bg);
	color: var(--input-fg);
	border: 1px solid var(--border);
	border-radius: 4px;
	padding: 6px 8px;
	font-family: inherit;
	font-size: 13px;
	order: 2;  /* Input comes second */
}

#input:focus {
	outline: 1px solid var(--vscode-focusBorder);
}

/* Command menu styles */
#command-menu {
	width: 100%;
	background: var(--vscode-editorWidget-background);
	border: 1px solid var(--border);
	border-radius: 4px;
	margin-bottom: 4px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
	display: none;
	z-index: 1000;
	order: 1;  /* Menu comes first (appears above) */
}

#command-menu.visible {
	display: block;
}

		.command-item {
			padding: 8px 12px;
			cursor: pointer;
			display: flex;
			flex-direction: column;
			gap: 2px;
			border-bottom: 1px solid var(--border);
		}

		.command-item:last-child {
			border-bottom: none;
		}

		.command-item:hover,
		.command-item.selected {
			background: var(--vscode-list-hoverBackground);
		}

		.command-name {
			font-size: 13px;
			font-weight: 500;
			color: var(--fg);
		}

		.command-description {
			font-size: 11px;
			color: var(--vscode-descriptionForeground);
			opacity: 0.8;
		}

		button {
			background: var(--button-bg);
			color: var(--button-fg);
			height: fit-content;
			border: none;
			border-radius: 4px;
			padding: 6px 12px;  /* Changed from 0 12px */
			cursor: pointer;
			font-size: 13px;
			flex: 0 0 auto;  /* This is the key! grow=0, shrink=0, basis=auto */
			white-space: nowrap;
		}

button:hover {
	opacity: 0.9;
}

		button:hover {
			opacity: 0.9;
		}

		/* Scrollbar styling */
		#chat::-webkit-scrollbar {
			width: 10px;
		}

		#chat::-webkit-scrollbar-track {
			background: var(--bg);
		}

		#chat::-webkit-scrollbar-thumb {
			background: var(--border);
			border-radius: 5px;
		}

		#chat::-webkit-scrollbar-thumb:hover {
			background: var(--vscode-scrollbarSlider-hoverBackground);
		}

		.mermaid {
	background: var(--assistant-bg);
	border: 1px solid var(--border);
	border-radius: 6px;
	padding: 12px;
	margin: 12px 0;
	overflow-x: auto;
}

	</style>
</head>
<body>
	<div id="chat"></div>

	<div id="input-container">
		<div id="input-wrapper">
			<div id="command-menu">
				<div class="command-item" data-command="/new">
					<span class="command-name">/new</span>
					<span class="command-description">Start a new conversation</span>
				</div>
				<div class="command-item" data-command="/clear">
					<span class="command-name">/clear</span>
					<span class="command-description">Clear chat history</span>
				</div>
			</div>
			<input
				id="input"
				placeholder="Ask about FogBugz…"
				onkeydown="handleKeyDown(event)"
			/>
			
		</div>
		<button onclick="send()" style="width:fit-content">Send</button>
	</div>

	<script>
		const vscode = acquireVsCodeApi();
		const chat = document.getElementById('chat');
		const input = document.getElementById('input');
		const commandMenu = document.getElementById('command-menu');
		let selectedCommandIndex = -1;

		const commands = [
			{ name: '/new', description: 'Start a new conversation' },
			{ name: '/clear', description: 'Clear chat history' }
		];

		// Configure marked.js options
		marked.setOptions({
			breaks: true,
			gfm: true,
			highlight: function(code, lang) {
				if (lang && hljs.getLanguage(lang)) {
					try {
						return hljs.highlight(code, { language: lang }).value;
					} catch (err) {}
				}
				return hljs.highlightAuto(code).value;
			}
		});

		// Request chat history when webview loads
		vscode.postMessage({ type: 'requestHistory' });

		// Show/hide command menu based on input
		input.addEventListener('input', function() {
			const value = input.value;
			if (value === '/' || value.startsWith('/')) {
				showCommandMenu();
				filterCommands(value);
			} else {
				hideCommandMenu();
			}
		});

		// Handle clicks outside to close menu
		document.addEventListener('click', function(e) {
			if (!input.contains(e.target) && !commandMenu.contains(e.target)) {
				hideCommandMenu();
			}
		});

		// Handle command item clicks
		document.querySelectorAll('.command-item').forEach(item => {
			item.addEventListener('click', function() {
				const command = this.getAttribute('data-command');
				input.value = command;
				hideCommandMenu();
				input.focus();
			});
		});

		function showCommandMenu() {
			commandMenu.classList.add('visible');
			selectedCommandIndex = -1;
			updateSelectedCommand();
		}

		function hideCommandMenu() {
			commandMenu.classList.remove('visible');
			selectedCommandIndex = -1;
		}

		function filterCommands(value) {
			const items = commandMenu.querySelectorAll('.command-item');
			let visibleCount = 0;
			
			items.forEach(item => {
				const command = item.getAttribute('data-command');
				if (command.startsWith(value.toLowerCase())) {
					item.style.display = 'flex';
					visibleCount++;
				} else {
					item.style.display = 'none';
				}
			});

			// Hide menu if no matches
			if (visibleCount === 0) {
				hideCommandMenu();
			}
		}

		function updateSelectedCommand() {
			const items = Array.from(commandMenu.querySelectorAll('.command-item')).filter(
				item => item.style.display !== 'none'
			);
			
			items.forEach((item, index) => {
				if (index === selectedCommandIndex) {
					item.classList.add('selected');
				} else {
					item.classList.remove('selected');
				}
			});
		}

		function handleKeyDown(event) {
			const isMenuVisible = commandMenu.classList.contains('visible');
			
			if (isMenuVisible) {
				const visibleItems = Array.from(commandMenu.querySelectorAll('.command-item')).filter(
					item => item.style.display !== 'none'
				);
				
				if (event.key === 'ArrowDown') {
					event.preventDefault();
					selectedCommandIndex = Math.min(selectedCommandIndex + 1, visibleItems.length - 1);
					updateSelectedCommand();
				} else if (event.key === 'ArrowUp') {
					event.preventDefault();
					selectedCommandIndex = Math.max(selectedCommandIndex - 1, 0);
					updateSelectedCommand();
				} else if (event.key === 'Enter') {
					if (selectedCommandIndex >= 0 && selectedCommandIndex < visibleItems.length) {
						event.preventDefault();
						const command = visibleItems[selectedCommandIndex].getAttribute('data-command');
						input.value = command;
						hideCommandMenu();
						return;
					}
					send();
				} else if (event.key === 'Escape') {
					event.preventDefault();
					hideCommandMenu();
				}
			} else if (event.key === 'Enter') {
				send();
			}
		}

		function addMessage(text, cls) {
			const div = document.createElement('div');
			div.className = 'message ' + cls;

			if (cls === 'assistant') {
				// Parse markdown for assistant messages
				const contentDiv = document.createElement('div');
				contentDiv.className = 'assistant-content';
				contentDiv.innerHTML = marked.parse(text);
				renderMermaid(contentDiv);
				// Add copy buttons to code blocks
				contentDiv.querySelectorAll('pre code').forEach((block) => {
					const wrapper = document.createElement('div');
					wrapper.className = 'code-block-wrapper';
					
					const copyBtn = document.createElement('button');
					copyBtn.className = 'copy-button';
					copyBtn.textContent = 'Copy';
					copyBtn.onclick = function() {
						const code = block.textContent;
						navigator.clipboard.writeText(code).then(() => {
							copyBtn.textContent = 'Copied!';
							copyBtn.classList.add('copied');
							setTimeout(() => {
								copyBtn.textContent = 'Copy';
								copyBtn.classList.remove('copied');
							}, 2000);
						});
					};
					
					const pre = block.parentElement;
					pre.parentElement.insertBefore(wrapper, pre);
					wrapper.appendChild(pre);
					wrapper.appendChild(copyBtn);
				});

				div.appendChild(contentDiv);
			} else {
				// Plain text for user and system messages
				div.textContent = text;
			}

			chat.appendChild(div);
			chat.scrollTop = chat.scrollHeight;
		}

		function sanitizeMermaid(source) {
		return source
			// Replace unicode arrows
			.replace(/→/g, '->')
			.replace(/←/g, '<-')
			.replace(/⇒/g, '=>')

			// Replace smart quotes
			.replace(/[“”]/g, '"')
			.replace(/[‘’]/g, "'")

			// Normalize ellipsis
			.replace(/…/g, '...')

			// REMOVE ALL PARENTHESES
			.replace(/[()]/g, '')

}
		function renderMermaid(container) {
  const mermaidBlocks = container.querySelectorAll('pre code.language-mermaid');
  const mermaidNodes = [];

  mermaidBlocks.forEach((block) => {
    const parentPre = block.parentElement;
    const graphDefinition = block.textContent;

    const mermaidDiv = document.createElement('div');
    mermaidDiv.className = 'mermaid';
    mermaidDiv.textContent = graphDefinition;

    parentPre.replaceWith(mermaidDiv);
    mermaidNodes.push(mermaidDiv);
  });

  if (mermaidNodes.length > 0) {
	try {		// Sanitize Mermaid definitions before rendering
		mermaidNodes.forEach(node => {
			node.textContent = sanitizeMermaid(node.textContent);
		});
		mermaid.run({ nodes: mermaidNodes });
	} catch (err) {
		console.error('Mermaid render failed:', err);
		// HARD FAIL: remove all Mermaid output
		mermaidNodes.forEach(div => div.remove());
	}
}
}



		function send() {
			const text = input.value.trim();
			if (!text) return;

			// Hide command menu if visible
			hideCommandMenu();

			// Check if user typed "/clear" command or "/new" 
			if ((text.toLowerCase() === '/clear') || (text.toLowerCase() === '/new')) {
				vscode.postMessage({ type: 'userMessage', text });
				input.value = '';
				return;
			}

			addMessage(text, 'user');
			vscode.postMessage({ type: 'userMessage', text });
			input.value = '';
		}

		window.addEventListener('message', event => {
			const msg = event.data;
			
			if (msg.type === 'assistant') {
				addMessage(msg.text, 'assistant');
			} else if (msg.type === 'loadHistory') {
				// Load chat history
				chat.innerHTML = '';
				msg.history.forEach(item => {
					addMessage(item.text, item.type);
				});
			} else if (msg.type === 'clearHistory') {
				// Clear chat history with optional system message
				chat.innerHTML = '';
				if (msg.message) {
					addMessage(msg.message, 'system');
				} else {
					addMessage('Chat history cleared.', 'system');
				}
			}
		});

		// Focus input on load
		input.focus();
	</script>
</body>
</html>
