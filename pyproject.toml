[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fogbugz-mcp"
version = "0.1.0"
description = "FastMCP server exposing FogBugz wikis and articles to Claude Desktop"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "IVP AI Boost" }
]

dependencies = [
  "beautifulsoup4>=4.14.3",
  "chromadb>=1.5.5",
  "deepagents==0.3.9",
  "faiss-cpu>=1.13.2",
  "fastmcp>=0.4.0",
  "httpx>=0.27.0",
  "langchain-mcp-adapters>=0.2.1",
  "langchain-openai>=1.1.7",
  "langgraph>=1.0.7",
  "litellm>=1.82.4",
  "lxml>=6.0.2",
  "markdownify>=1.2.2",
  "mem0ai>=1.0.6",
  "openai>=2.16.0",
  "openpyxl>=3.1.5",
  "pandas>=3.0.1",
  "python-dotenv>=1.0.1",
  "xmltodict>=1.0.2",
]

[project.scripts]
fogbugz-mcp = "fogbugz_mcp.app.server:main"

[tool.setuptools]
packages = ["fogbugz_mcp.app"]
